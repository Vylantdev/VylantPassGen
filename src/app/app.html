<div class="app-shell">
  <main class="content">
    <section class="password-card">
      <button
        type="button"
        class="password-display"
        (click)="copyCurrent()"
        [disabled]="!currentPassword()"
      >
        @if (currentPassword()) {
          {{ currentPassword() }}
        } @else {
          <span class="placeholder-text">Press Generate to create a password</span>
        }
      </button>

      <div class="actions">
        <button class="btn primary" (click)="generate()" [disabled]="!canGenerate()">Generate</button>
        <button class="btn secondary" (click)="copyCurrent()" [disabled]="!currentPassword()">Copy</button>
      </div>
    </section>

    <app-options-panel [(options)]="options" />
  </main>

  <footer class="footer">
    <button class="history-btn" (click)="historyOpen.set(true)">History</button>

    <button class="credits" (click)="openWebsite()">&copy; 2026 Vylant.dev</button>

    <button class="github-link" (click)="openGithub()" aria-label="GitHub repository">
      <svg viewBox="0 0 16 16" fill="currentColor" width="20" height="20">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
      </svg>
    </button>
  </footer>

  <app-history-panel
    [entries]="history()"
    [open]="historyOpen()"
    (closePanel)="historyOpen.set(false)"
    (copyEntry)="copyFromHistory($event)"
    (clearHistory)="clearHistory()"
  />

  <div class="toast" [class.visible]="toastVisible()">Copied to clipboard</div>
</div>
